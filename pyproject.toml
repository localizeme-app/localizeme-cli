[build-system]
# 77 is the first setuptools that writes the license as a PEP 639 expression.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "localizeme"
dynamic = ["version"]
description = "Command line client for LocalizeMe: pull and push translations from your build."
readme = "README.md"
# PolyForm Shield has no SPDX identifier, so it is named as a custom reference
# and the full text ships in LICENSE, the same terms as the mobile SDKs.
license = "LicenseRef-PolyForm-Shield-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Devsolutely", email = "hello@localizeme.app" }]
keywords = ["localization", "i18n", "translation", "cli", "android", "ios", "xcstrings"]

# 3.10 is the floor rather than 3.11 so `pipx install localizeme` does not fail
# on a CI image that has not moved yet. That rules out tomllib, which is why the
# config file is JSON.
requires-python = ">=3.10"

# No runtime dependencies, deliberately. A CI step that installs a dependency
# tree is a CI step that breaks on someone else's release, and everything here
# is reachable from the standard library.
dependencies = []

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Localization",
]

[project.urls]
Homepage = "https://localizeme.app"
Documentation = "https://github.com/localizeme-app/localizeme-cli#readme"
Source = "https://github.com/localizeme-app/localizeme-cli"

[project.scripts]
localizeme = "localizeme_cli.main:main"

[tool.setuptools.dynamic]
version = { attr = "localizeme_cli.__version__" }

[tool.setuptools.packages.find]
include = ["localizeme_cli*"]
