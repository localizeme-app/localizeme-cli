name: Publish to PyPI

# A pushed tag builds the package and publishes it to PyPI as `localizeme`.
# There is no token anywhere: PyPI trusts this workflow file, in this
# repository, running in the `pypi` environment (trusted publishing). See
# RELEASING.md. The tag has to match __version__ in localizeme_cli/__init__.py.
on:
  push:
    tags: ['*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the tag matches the version
        run: |
          version=$(python -c 'import localizeme_cli; print(localizeme_cli.__version__)')
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $version in localizeme_cli/__init__.py"
            exit 1
          fi
      - name: Tests
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: .
      - name: Build
        run: |
          python -m pip install --quiet build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Separate from the build, so only this job can mint the identity token
  # PyPI accepts, and it runs no code from the repository.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/localizeme/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
