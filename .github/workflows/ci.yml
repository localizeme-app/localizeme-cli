name: CI

# Runs in the public localizeme-cli repository, which is an export of cli/ in
# the LocalizeMe monorepo. There it does nothing.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # From the floor in pyproject.toml to the newest release.
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: .
      # What `pipx install localizeme` gets: the built wheel, installed on its
      # own, away from the source tree.
      - name: Build and install the package
        run: |
          python -m pip install --quiet build
          python -m build
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/pip" install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/installed/bin/localizeme" --version
          "$RUNNER_TEMP/installed/bin/localizeme" --help > /dev/null
